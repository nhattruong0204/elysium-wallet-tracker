# Required in .env: POSTGRES_PASSWORD (URL-safe, e.g. `openssl rand -hex 24`),
# TG_BOT_TOKEN, TG_CHAT_ID. Nothing here is exposed on the host network.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-db-url: &db-url
  DATABASE_URL: postgresql+psycopg://tracker:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/tracker

services:
  postgres:
    image: postgres:16-alpine
    container_name: elysium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 128m
    mem_limit: 512m
    logging: *logging

  # One-shot: applies Alembic migrations, then exits. The tracker waits for it.
  migrate:
    build: .
    image: elysium-wallet-tracker:latest
    command: ["--migrate"]
    environment:
      <<: *db-url
      # optional: when set, --migrate (re)sets the dashboard_ro password (scram-sha-256)
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD:-}
      # Optional dedicated Consensus settings role (no Telegram secrets in migrate).
      CONSENSUS_DB_PASSWORD: ${CONSENSUS_DB_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging

  tracker:
    image: elysium-wallet-tracker:latest
    container_name: elysium-wallet-tracker
    restart: unless-stopped
    env_file: .env                 # TG_BOT_TOKEN, TG_CHAT_ID
    environment:
      <<: *db-url
      # Telegram-only mute by exact contract (still indexed, in PnL, signals and the website).
      # Bridged USDC on Elysium mainnet (HyperEVM USDC 0xb88339cb7199b77e23db6e890353e22632ba630f
      # via the Orbit gateway); evidence in docs/OPERATIONS.md "Telegram-only token mute".
      ALERTS_TELEGRAM_MUTE_TOKENS: "0xb47c4c8f73f009cc0c0d3f92b388d13e293f0b65"
      # Wallets removed from tracking by the operator (2026-11-10: machines; see
      # docs/OPERATIONS.md "Blocked wallets"). History is kept; delete an address to reinstate.
      TRACKING_BLOCKED_WALLETS: >-
        0xf70da97812cb96acdf810712aa562db8dfa3dbef
        0xf8fe0956cc3e5c3df0da1085bf40b397318624e6
        0x00c18c85bf479ba2768d9faa7c02a39f2617592e
        0x75d2ae0861661ef7479e9229a3e3e2cdd14dfb08
        0xfffff389f8b090073efb9ac908323b2d5895f7d9
    volumes:
      - ./config:/config:ro        # config.yaml + watchlist.txt
      - tracker-data:/data         # v0.1/v0.2 SQLite file lives here (for --import-sqlite)
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    mem_limit: 256m
    logging: *logging

  # Telegram Intelligence Center: menu, reports, exports (the only getUpdates consumer
  # for the bot) + the market snapshot collector. Read-mostly; never takes the indexer lock.
  ui:
    image: elysium-wallet-tracker:latest
    container_name: elysium-ui
    command: ["--ui"]
    restart: unless-stopped
    env_file: .env                 # TG_BOT_TOKEN, TG_CHAT_ID, optional TG_ADMIN_IDS
    environment: *db-url
    volumes:
      - ./config:/config:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "agora_tracker", "--health-ui"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    stop_grace_period: 30s
    mem_limit: 384m
    logging: *logging

  # Public research dashboard (onchainflow.app, via the reverse proxy on the host).
  # Connects ONLY as the read-only `dashboard_ro` role (views in schema public_api): no
  # env_file, so no Telegram or admin credentials exist inside this container.
  web:
    image: elysium-wallet-tracker:latest
    container_name: elysium-web
    command: ["--web", "--host", "0.0.0.0", "--port", "8100"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://dashboard_ro:${DASHBOARD_DB_PASSWORD:-unset}@postgres:5432/tracker
      # Web-only: hidden from the DEFAULT Activity feed / overview preview (exact address,
      # Elysium mainnet USDC, chain 99901; evidence in docs/OPERATIONS.md). Still indexed,
      # still in PnL/rankings, still shown on its token page or with an explicit token filter.
      WEB_ACTIVITY_HIDDEN_TOKENS: "0xb47c4c8f73f009cc0c0d3f92b388d13e293f0b65"
      # Separate narrow writer role for owner-authenticated Consensus settings only.
      CONSENSUS_DB_PASSWORD: ${CONSENSUS_DB_PASSWORD:-}
      CONSENSUS_ADMIN_KEY: ${CONSENSUS_ADMIN_KEY:-}
    ports:
      - "127.0.0.1:8100:8100"      # loopback only; the host reverse proxy is the public edge
    volumes:
      - ./config:/config:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 6s
      start_period: 30s
      retries: 3
    stop_grace_period: 15s
    mem_limit: 256m
    logging: *logging

  # Dedicated send-only Consensus Telegram bot; never polls getUpdates and never
  # affects the existing tracker/UI chats. The profile is OFF unless opted in.
  consensus-alerts:
    profiles: ["consensus-alerts"]
    image: elysium-wallet-tracker:latest
    container_name: elysium-consensus-alerts
    command: ["--consensus-alerts"]
    restart: unless-stopped
    environment:
      CONSENSUS_PUBLIC_DATABASE_URL: postgresql+psycopg://dashboard_ro:${DASHBOARD_DB_PASSWORD:-unset}@postgres:5432/tracker
      CONSENSUS_DB_PASSWORD: ${CONSENSUS_DB_PASSWORD:-}
      CONSENSUS_TG_BOT_TOKEN: ${CONSENSUS_TG_BOT_TOKEN:-}
      CONSENSUS_TG_CHAT_ID: ${CONSENSUS_TG_CHAT_ID:-}
      # Never alert the group about tokens the website hides (Elysium mainnet USDC).
      CONSENSUS_HIDDEN_TOKENS: "0xb47c4c8f73f009cc0c0d3f92b388d13e293f0b65"
    volumes:
      - ./config:/config:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    # The image's default health check (`--health`) needs DATABASE_URL, which this service
    # deliberately does not have; check the sender loop's own heartbeat instead.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; from agora_tracker.consensus_delivery import healthy; sys.exit(0 if healthy() else 1)"]
      interval: 60s
      timeout: 15s
      start_period: 120s
      retries: 3
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    logging: *logging

  # Daily pg_dump (custom format), verified with pg_restore --list, pruned after N days.
  backup:
    image: postgres:16-alpine
    container_name: elysium-backup
    restart: unless-stopped
    entrypoint: ["sh", "/scripts/pg-backup-loop.sh"]
    environment:
      PGHOST: postgres
      PGUSER: tracker
      PGDATABASE: tracker
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_INTERVAL_S: ${BACKUP_INTERVAL_S:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    logging: *logging

volumes:
  pgdata:
  tracker-data:
