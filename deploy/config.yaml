# Production config, shipped to the VPS by the deploy workflow (edit via PR). No secrets here.

chain:
  # Read-only RPC. Pre-launch the only public node is Kleos's; after Nov 9 add Kinetiq's
  # official RPC first and keep this as a fallback. Every node you use sees your IP.
  rpc_urls:
    - https://rpc.thekleos.xyz/rpc
  chain_id: 99901              # Elysium mainnet. The tracker refuses to run on a mismatch.
  poll_interval_s: 5           # pre-launch blocks only move per batch (~3h); 5s is plenty after launch too
  max_block_range: 2000        # auto-halves if the node rejects a range
  confirmations: 0             # single sequencer, so reorgs are very unlikely; replays are deduped anyway
  backfill_blocks: 2000        # first run only
  wallet_chunk: 50             # addresses per eth_getLogs OR-list
  rpc_batch_size: 50
  wrapped_native: null         # set to WHYPE's address on Elysium if routers use it
  explorer_tx_url: null        # e.g. "https://<explorer>/tx/{tx}"
  explorer_address_url: null   # e.g. "https://<explorer>/address/{address}"

leaderboard:
  # Found by `--discover` from the VPS on 2026-11-02 (100 rows). Values are in HYPE.
  enabled: true
  url: https://api.agoradex.app/api/traders
  method: GET
  params:
    sort: pnl
    limit: 100
  headers:
    accept: application/json
    referer: https://www.agoradex.app/traders
  body: null
  items_path: traders
  fields:
    address: address
    pnl: pnlHype
    worth: worthHype
    volume: volumeHype
    trades: trades
  sort_by: pnl
  value_unit: HYPE
  top_n: 100
  refresh_s: 300               # be polite: 5 min is enough for a PnL leaderboard

alerts:
  min_trade_hype: 0.5          # ignore smaller buys/sells
  alert_transfers: true        # token moved wallet-to-wallet (rotation to a fresh wallet, OTC)
  leaderboard_alerts: true
  rank_change: 10              # alert when a wallet moves >= 10 places
  pnl_change: 50               # HYPE (~$4k): alert when a wallet's PnL moves this much between refreshes
  cluster_window_s: 3600
  cluster_min_wallets: 3       # >= 3 tracked wallets buying the same token within the window
  hype_dust: 0.0005
  ignore_tokens: []            # e.g. stablecoins or $AGORA if you don't care about them

telegram:
  bot_token_env: TG_BOT_TOKEN
  chat_id_env: TG_CHAT_ID
  min_interval_s: 1.1
  max_attempts: 12             # transient failures back off 10s, 20s, 40s ... 1h; then dead-lettered

# Storage is PostgreSQL, configured with the DATABASE_URL environment variable
# (docker-compose.yml sets it). Nothing to configure here.
watchlist_file: watchlist.txt  # deploy/watchlist.txt in the repo
exclude_contracts: true
