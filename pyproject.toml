[project]
name = "elysium-wallet-tracker"
version = "0.2.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["B904", "E501"]  # long SQL/f-strings; formatting is not a correctness issue

[tool.ruff.lint.per-file-ignores]
"tests/test_unsigned_plan_api.py" = ["F811"]  # shared secure auth fixture
"tests/test_unsigned_plan_browser.py" = ["F811"]  # shared secure plan fixture
"tests/test_trading_auth_http.py" = ["F811"]  # auth fixture import
"tests/test_trading_auth_browser.py" = ["F811"]  # HTTPS fixture import
"tests/test_miniapp_browser.py" = ["F811"]  # fixture imported from test_miniapp
"tests/test_web.py" = ["F811"]  # pytest fixtures imported from test_dashboard_db
"tests/test_usd.py" = ["F811"]
"tests/test_activity.py" = ["F811"]
"tests/test_activity_browser.py" = ["F811"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["^tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
faulthandler_timeout = 120   # dump every thread's stack if one test hangs (CI shows where)
