# Copy to config.yaml. Secrets come from env: TG_BOT_TOKEN, TG_CHAT_ID.

chain:
  # Read-only RPCs, tried in order with failover (benchmarked 2026-11-02, see issue #30).
  # Use "latest state" nodes only. rpc.boxa.club is BOXA's *batch-confirmed* node, hours
  # behind the live head, and would delay alerts; the head-lag guard would skip it anyway.
  # After Nov 9 add Kinetiq's official RPC. Every node you use sees your VPS's IP.
  rpc_urls:
    - https://rpc.thekleos.pro/rpc        # Kleos (new address, moved off the wallet blocklist 2026-11-03)
    - https://rpc.thekleos.xyz/rpc        # Kleos (old address; remove once it stops answering)
    - https://rpc-live.boxa.club          # BOXA (batches capped at 20; learned automatically)
    - https://rpc-live.elyspump.com       # ElysPump
  chain_id: 99901              # Elysium mainnet. The tracker refuses to run on a mismatch.
  poll_interval_s: 5           # live nodes produce blocks continuously (~1s)
  max_block_range: 2000        # auto-halves if the node rejects a range
  confirmations: 0             # single sequencer, so reorgs are very unlikely; replays are deduped anyway
  backfill_blocks: 2000        # first run only
  wallet_chunk: 50             # addresses per eth_getLogs OR-list (BOXA allows <100: learned automatically)
  scan_mode: auto              # filtered | full | auto: see docs/OPERATIONS.md (Wallet universe and scan cost)
  full_scan_above_calls: 2     # auto: one unfiltered Transfer query per range once filtering would need more calls than this
  full_scan_max_span: 1000     # Kleos limits unfiltered log searches to 1,000 blocks
  full_scan_max_logs_per_block: 25   # busier than this (mainnet launch?): wallet filters for 10 min, then retest
  min_block_range: 50          # floor when a node rejects a range and the span is halved
  rpc_batch_size: 50           # upper bound; smaller per-node limits are learned
  max_head_lag: 50             # skip a node this many blocks behind the best one
  head_check_s: 60             # how often node heads are compared
  wrapped_native: null         # set to WHYPE's address on Elysium if routers use it

tracking:
  cumulative: true             # keep every wallet that was ever in an accepted top list (false = old behaviour)
  capacity_warn: 1000          # wallets; a warning level, never a cap. Set from measured capacity
  lag_warn_blocks: 3000        # scanner lag that is reported as falling behind

leaderboard:
  enabled: true
  # Fill this section with:  python -m agora_tracker --import-curl curl.txt
  url: ""                      # the JSON endpoint behind agoradex.app/traders
  method: GET
  params: {}
  headers: {}
  body: null
  items_path: ""               # dotted path to the trader list in the response
  fields:                      # dotted paths inside one trader object
    address: address
    pnl: pnl
    worth: totalWorth
    volume: volume
    trades: trades
  sort_by: pnl
  value_unit: USD              # unit of pnl/worth/volume in the response (Agora: HYPE)
  top_n: 100
  refresh_s: 300               # be polite: 5 min is enough for a PnL leaderboard

alerts:
  min_trade_hype: 0.5          # ignore smaller buys/sells
  alert_transfers: true        # token moved wallet-to-wallet (rotation to a fresh wallet, OTC)
  leaderboard_alerts: true
  rank_change: 10              # alert when a wallet moves >= 10 places
  pnl_change: 5000             # alert when PnL moves this much (in leaderboard.value_unit)
  cluster_window_s: 3600
  cluster_min_wallets: 3       # >= 3 tracked wallets buying the same token within the window
  hype_dust: 0.0005
  ignore_tokens: []            # e.g. stablecoins or $AGORA if you don't care about them
  mute_tokens: []              # indexed, but no Telegram alert and hidden on the Activity tab


links:                         # every alert detail links here (formats verified 2026-11-02)
  explorer: https://elyscan.live
  agora: https://www.agoradex.app
  kleos: https://www.thekleos.pro
  boxa: https://boxa.club
  elyspump: https://elysp.com

intel:                         # launch intelligence: ALERTS ONLY, no order is ever placed
  independent_min: 3           # unrelated wallets that make the strong signal (bundle wallets count once)
  independent_window_s: 1800
  paper_enabled: true          # log each strong signal and measure it forward (/maint paper-report)
  paper_slippage_pct: 10
  dd_enabled: true             # due-diligence block (pool/curve HYPE, owner share, sellers, mint powers)
  dd_budget_s: 6
  dd_factories:                # DEX factories with getPool(); new ones are learned from PoolCreated
    - "0x1707327f626496a7b5b3872e7e4d2879df7d7a9f"   # PERPME DEX (Uniswap-V3 style)
  launch_watch: true           # PoolCreated events: venues Agora does not index
  launch_min_liquidity_hype: 300
  launch_delay_s: 120
  new_launchpad_alerts: true   # Agora lists a launchpad we have not seen before
  ascend_index: true           # Ascend launches from its own hook events (pool, fee, pair, dev buy)
  ascend_max_chunks: 2         # x 5,000 blocks per minute: the backfill never crowds the indexer

market:                        # token stats in alerts, from Agora's public API (values in HYPE)
  enabled: true
  api: https://api.agoradex.app
  cache_s: 60
  timeout_s: 6

telegram:
  bot_token_env: TG_BOT_TOKEN
  chat_id_env: TG_CHAT_ID
  min_interval_s: 1.1
  max_attempts: 12             # transient failures back off 10s, 20s, 40s ... 1h; then dead-lettered

# Storage is PostgreSQL, configured with the DATABASE_URL environment variable
# (docker-compose.yml sets it). Nothing to configure here.
watchlist_file: watchlist.txt  # extra wallets to follow regardless of rank
exclude_contracts: true

# Telegram Intelligence Center (`ui` service). Authorized users: TG_CHAT_ID + TG_ADMIN_IDS.
ui:
  timezone: Asia/Ho_Chi_Minh   # display only; storage and queries are UTC
  page_size: 5
  workers: 4                   # concurrent interactive requests
  report_workers: 1            # concurrent exports (cannot starve the indexer)
  report_queue: 3
  report_max_rows: 50000       # per table
  report_max_bytes: 20000000   # Telegram allows bots up to 50 MB
  query_timeout_ms: 15000
  qualified_min_pnl: 0         # "qualified" wallet: Agora PnL above this (leaderboard unit)
  min_volume_hype: 25          # gainers/losers: ignore tokens below this window volume
  min_mcap_hype: 100           # ... below this market cap
  min_age_h: 1                 # ... younger than this
  min_observations: 2          # snapshot returns need >= this many points
  candle_fallback_tokens: 30   # custom windows <= 7d: tokens checked via Agora candles

# Market snapshots for historical returns (runs inside the ui service).
collector:
  enabled: true
  interval_s: 600
  top_n: 150                   # chain-wide, by 24h volume (Agora)
  tracked_days: 7              # + tokens tracked wallets traded recently
  max_details_per_round: 20
  retention_days: 30           # ~22k rows/day; pruned daily

# Explainable wallet scores (agora_tracker/scoring.py, shown in Wallet intelligence). A score
# version is immutable: change any weight or parameter below and you must change `version`,
# otherwise the job refuses to run. Not a prediction; see /about#scores.
scoring:
  enabled: true
  version: v1
  interval_s: 3600
  retention_hourly_h: 48       # older hourly rows are thinned to one per day
  lookback_days: 30
  min_closes: 5                # measured closing trades needed for the PnL components
  min_snapshots: 12            # accepted lists needed for list persistence
  limited_cap: 50              # a score without measured trade evidence cannot exceed this

# Issue #82 PAPER UI with read-only canonical V2 quotes. No signer or broadcaster.
# Keep OFF pending review; turning this on never enables real-money execution.
trading:
  paper_enabled: false
  # Required for the read-only quote workflow; parent directory must be owned by UI user, mode 0700.
  # paper_order_path: /data/private-trading/paper.sqlite
  # miniapp_url: https://preview.example.com/  # optional private-chat launcher; C1 API denies until #89
  # paper_rpc_url: https://rpc.agoradex.app  # dedicated read transport, independent of scanner
  # Private order ledger (docs/TRADING_ORDER_LEDGER.md). Needs migration 0011, TRADING_DB_PASSWORD
  # at --migrate time and TRADING_DB_URL (user trading_rw) in the ui service. Enabling it makes
  # /pause_trading durable; wallet requests stay disabled until an owner sets the execution flag.
  # ledger_enabled: false
  # Wallet-managed Buy/Sell prompts (docs/TRADING_WALLET_APPROVALS.md). OFF; needs ledger_enabled,
  # the owner-only execution flag, migrations 0012/0013 and TRADING_EXEC_RPC_URL (a SECRET,
  # dedicated RPC url: never the scanner's). The server never signs or broadcasts.
  # wallet_execution_enabled: false
  # Confirmations before a receipt is treated as final (docs/TRADING_RECEIPTS.md). An assumption
  # about reorg depth, not a guarantee; fills are provisional until it is reached.
  # finality_confirmations: 12
  # finality_require_finalized_tag: true   # F-04: final = depth AND every source's `finalized` tag
  #                                        # (docs/TRADING_FINALITY.md); false is a reviewed downgrade
  # corroboration_max_head_skew_blocks: 64 # Elysium makes 5-10 blocks/s; lowest head is the anchor
  # RPC corroboration (docs/TRADING_RPC_CORROBORATION.md, #95 F-15; replaces recovery_rpc_urls_env).
  # Receipts, finalization, fills, reorgs, automatic lock release and owner leg recovery
  # (docs/TRADING_LEG_RECOVERY.md) are recorded only on facts that >= 2 endpoints with distinct
  # hosts AND distinct operators agree on at one anchor block: TRADING_EXEC_RPC_URL plus the
  # comma-separated SECRET urls in the env var named here (optionally `label=url` to name the
  # operator). Unset => nothing safety-critical is recorded (fail closed). Two brands that share
  # an upstream node are NOT independent; that cannot be checked here, it is your attestation.
  # corroboration_rpc_urls_env: TRADING_CORROBORATION_RPC_URLS
  # execution_rpc_operator: ""         # optional operator label for TRADING_EXEC_RPC_URL
  # corroboration_calls_per_pass: 120  # RPC calls one reconciler pass may spend in total
  # Supervised reconciliation worker (docs/TRADING_WORKER_LIFECYCLE.md). Starts ONLY when
  # wallet_execution_enabled is true (then a missing ledger / TRADING_EXEC_RPC_URL is fatal).
  # worker_interval_s: 10            # between cycles while there is work
  # worker_idle_interval_s: 30       # between cycles when idle (an idle cycle makes no RPC calls)
  # worker_max_backoff_s: 300        # ceiling for failure backoff
  # worker_batch: 50                 # legs per pass per reconciler
  # worker_pass_budget_s: 20         # wall-clock cap of one cycle
  # worker_rpc_calls_per_min: 240    # hard cap on execution-RPC calls per minute
  # worker_standby_retry_s: 15       # standby retries the one-worker lease this often
  # Private Mini App / wallet ingress (docs/TRADING_INGRESS.md, #95 F-16). OFF: no listener exists.
  # Loopback only; an operator-owned HTTPS reverse proxy is the public side and must inject the
  # shared secret in TRADING_INGRESS_SECRET (>= 32 chars, env only) as X-Elysium-Ingress. Needs
  # paper_enabled + paper_order_path; miniapp_url must be the origin's root. The wallet routes are
  # mounted only if wallet_execution_enabled is ALSO true (and then still need the durable flag).
  # ingress_enabled: false
  # ingress_origin: https://app.example.com
  # ingress_auth_path: /data/private-trading/auth.sqlite   # dir 0700, file 0600
  # ingress_bind_host: 127.0.0.1     # loopback only (validated)
  # ingress_port: 8765
  # ingress_max_concurrency: 32      # open connections; 503 above
  # ingress_threads: 8               # blocking-work threads
  # ingress_max_body_bytes: 16384
  # ingress_request_timeout_s: 30
  # ingress_keepalive_s: 5
