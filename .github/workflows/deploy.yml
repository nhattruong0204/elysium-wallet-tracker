name: deploy

# Manual-only. Connects to the VPS over SSH from GitHub's runner and runs scripts/remote.sh.
# Repository secrets (Settings > Secrets and variables > Actions):
#   VPS_HOST          IP or hostname                         (required)
#   VPS_USER          SSH user, root or a docker-group user  (required)
#   VPS_PASSWORD      SSH password      } one of the two      (required)
#   VPS_SSH_KEY       private key (PEM) }  key preferred
#   VPS_PORT          SSH port, default 22                   (optional)
#   VPS_HOST_KEY      known_hosts line to pin the server key (optional, recommended)
#   TG_BOT_TOKEN, TG_CHAT_ID                                 (required for deploy)
#   TG_ADMIN_IDS        optional: more Telegram user ids allowed to use the menu

# Two ways to run it:
#  * Actions tab > deploy > Run workflow (pick an action), or
#  * push a commit to the `ops` branch whose deploy/OPS_REQUEST file names the action
#    (lets automation operate the VPS without workflow-dispatch permission).
on:
  push:
    branches: [ops]
    paths: [deploy/OPS_REQUEST]
  workflow_dispatch:
    inputs:
      action:
        description: What to do on the VPS
        type: choice
        default: status
        options: [preflight, deploy, status, logs, discover, dry-run, test-telegram, test-card, ui-smoke, restart, stop]
      deploy_dir:
        description: Directory on the VPS (relative to the SSH user's home, or absolute)
        type: string
        default: elysium-wallet-tracker
      install_docker:
        description: Install Docker if missing (only works when VPS_USER is root)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vps
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve request
        env:
          IN_ACTION: ${{ inputs.action }}
          IN_DIR: ${{ inputs.deploy_dir }}
          IN_INSTALL: ${{ inputs.install_docker }}
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            # deploy/OPS_REQUEST: lines of key=value (action, deploy_dir, install_docker)
            get() { grep -E "^$1=" deploy/OPS_REQUEST | head -1 | cut -d= -f2- | tr -d '[:space:]'; }
            IN_ACTION="$(get action)"; IN_DIR="$(get deploy_dir)"; IN_INSTALL="$(get install_docker)"
          fi
          case "$IN_ACTION" in
            preflight|deploy|status|logs|discover|dry-run|test-telegram|test-card|ui-smoke|restart|stop) ;;
            *) echo "invalid action '$IN_ACTION'"; exit 1 ;;
          esac
          [ "$IN_INSTALL" = true ] || IN_INSTALL=false
          {
            echo "ACTION=$IN_ACTION"
            echo "DIR=${IN_DIR:-elysium-wallet-tracker}"
            echo "INSTALL_DOCKER=$IN_INSTALL"
          } >> "$GITHUB_ENV"

      - name: Check inputs and secrets
        env:
          HAS_PW: ${{ secrets.VPS_PASSWORD != '' }}
          HAS_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
          HAS_TG: ${{ secrets.TG_BOT_TOKEN != '' }}
        run: |
          [[ "$DIR" =~ ^[A-Za-z0-9._/~-]+$ ]] || { echo "deploy_dir has unsafe characters"; exit 1; }
          [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] || { echo "missing VPS_HOST / VPS_USER secrets"; exit 1; }
          [ "$HAS_PW" = true ] || [ "$HAS_KEY" = true ] || { echo "set VPS_SSH_KEY or VPS_PASSWORD"; exit 1; }
          if [ "$ACTION" = deploy ] && [ "$HAS_TG" != true ]; then echo "deploy needs the TG_BOT_TOKEN secret"; exit 1; fi
          echo "action=$ACTION dir=$DIR auth=$([ "$HAS_KEY" = true ] && echo key || echo password)"

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          PORT="${VPS_PORT:-22}"
          if [ -n "$VPS_HOST_KEY" ]; then
            echo "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          else
            # Trust on first use; pin it later by saving this line as the VPS_HOST_KEY secret.
            ssh-keyscan -p "$PORT" -T 15 "$VPS_HOST" 2>/dev/null > ~/.ssh/known_hosts
            [ -s ~/.ssh/known_hosts ] || { echo "could not reach $VPS_HOST:$PORT over SSH"; exit 1; }
            echo "Host key fingerprints (set VPS_HOST_KEY to pin):"
            ssh-keygen -lf ~/.ssh/known_hosts
          fi
          if [ -n "$VPS_SSH_KEY" ]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
            echo "SSH_OPTS=-i $HOME/.ssh/id_deploy -o BatchMode=yes" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y -qq sshpass >/dev/null
            echo "SSH_OPTS=-o PreferredAuthentications=password -o PubkeyAuthentication=no" >> "$GITHUB_ENV"
            echo "USE_SSHPASS=1" >> "$GITHUB_ENV"
          fi
          echo "SSH_TARGET=$VPS_USER@$VPS_HOST" >> "$GITHUB_ENV"
          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"

      - name: Run on VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_ADMIN_IDS: ${{ secrets.TG_ADMIN_IDS }}
        run: |
          ssh_() {
            if [ -n "${USE_SSHPASS:-}" ]; then
              sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
                -o ServerAliveInterval=30 $SSH_OPTS "$SSH_TARGET" "$@"
            else
              ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
                -o ServerAliveInterval=30 $SSH_OPTS "$SSH_TARGET" "$@"
            fi
          }
          ssh_ "echo connected to \$(hostname) as \$(id -un); uname -sr"
          if [ "$ACTION" = deploy ] && [ -z "$TG_CHAT_ID" ]; then
            # No TG_CHAT_ID secret: take the chat of the most recent message sent to the bot
            # (the user sends /start first). getUpdates only works while no webhook is set.
            TG_CHAT_ID=$(curl -fsS --retry 3 "https://api.telegram.org/bot${TG_BOT_TOKEN}/getUpdates" \
              | jq -r '[.result[] | (.message // .edited_message // .my_chat_member // .channel_post) | .chat.id | select(. != null)] | last // empty' || true)
            if [ -n "$TG_CHAT_ID" ]; then
              echo "::add-mask::$TG_CHAT_ID"
              echo "TG_CHAT_ID detected from the latest message sent to the bot"
            else
              # Normal once the Telegram UI runs (it consumes updates): the VPS keeps the
              # value it already has in .env; remote.sh fails if there is none.
              echo "TG_CHAT_ID not detectable here; keeping the value already on the VPS"
            fi
          fi
          if [ "$ACTION" = deploy ]; then
            # code bundle (tracked files only; never .env, config/, backups/)
            git archive --format=tar HEAD | \
              ssh_ "mkdir -p '$DIR' && cd '$DIR' && rm -rf agora_tracker && tar -xf -"
            # Telegram secrets, written with 0600; POSTGRES_PASSWORD is generated on the VPS
            printf 'TG_BOT_TOKEN=%s\nTG_CHAT_ID=%s\nTG_ADMIN_IDS=%s\n' "$TG_BOT_TOKEN" "$TG_CHAT_ID" "$TG_ADMIN_IDS" | \
              ssh_ "umask 077 && cat > '$DIR/.env.incoming'"
          fi
          ssh_ "bash -s -- '$ACTION' '$DIR' '$INSTALL_DOCKER'" < scripts/remote.sh
