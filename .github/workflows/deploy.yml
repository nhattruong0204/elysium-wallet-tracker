name: deploy

# Manual-only. Connects to the VPS over SSH from GitHub's runner and runs scripts/remote.sh.
# Repository secrets (Settings > Secrets and variables > Actions):
#   VPS_HOST          IP or hostname                         (required)
#   VPS_USER          SSH user, root or a docker-group user  (required)
#   VPS_PASSWORD      SSH password      } one of the two      (required)
#   VPS_SSH_KEY       private key (PEM) }  key preferred
#   VPS_PORT          SSH port, default 22                   (optional)
#   VPS_HOST_KEY      known_hosts line to pin the server key (optional, recommended)
#   TG_BOT_TOKEN, TG_CHAT_ID                                 (required for deploy)
#   TG_ADMIN_IDS        optional: more Telegram user ids allowed to use the menu

# Two ways to run it:
#  * Actions tab > deploy > Run workflow (pick an action), or
#  * push a commit to the `ops` branch whose deploy/OPS_REQUEST file names the action
#    (lets automation operate the VPS without workflow-dispatch permission).
on:
  push:
    branches: [ops]
    paths: [deploy/OPS_REQUEST]
  schedule:
    # Daily verified off-site backup of both databases, 02:30 Bangkok (kept 14 days).
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: What to do on the VPS
        type: choice
        default: status
        options: [preflight, deploy, tracker, tracker-rollback, web-hotfix, web-hotfix-rollback, status, logs, discover, dry-run, test-telegram, test-card, ui-smoke, restart, stop, audit, backup, maint, web, web-smoke, web-rollback, loadtest]
      deploy_dir:
        description: Directory on the VPS (relative to the SSH user's home, or absolute)
        type: string
        default: elysium-wallet-tracker
      install_docker:
        description: Install Docker if missing (only works when VPS_USER is root)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read          # maint/delete-copies checks that a verified backup run exists

concurrency:
  group: vps
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve request
        env:
          IN_ACTION: ${{ inputs.action }}
          IN_DIR: ${{ inputs.deploy_dir }}
          IN_INSTALL: ${{ inputs.install_docker }}
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            IN_ACTION=backup; IN_DIR=""; IN_INSTALL=false
          fi
          if [ "${{ github.event_name }}" = push ]; then
            # deploy/OPS_REQUEST: lines of key=value (action, deploy_dir, install_docker)
            get() { grep -E "^$1=" deploy/OPS_REQUEST | head -1 | cut -d= -f2- | tr -d '[:space:]'; }
            IN_ACTION="$(get action)"; IN_DIR="$(get deploy_dir)"; IN_INSTALL="$(get install_docker)"
            IN_SCOPE="$(get scope)"; IN_STEPS="$(get steps)"; IN_BACKUP_RUN="$(get backup_run)"
          fi
          case "$IN_ACTION" in
            preflight|deploy|tracker|tracker-rollback|web-hotfix|web-hotfix-rollback|status|logs|discover|dry-run|test-telegram|test-card|ui-smoke|restart|stop|audit|backup|maint|web|web-smoke|web-rollback|loadtest) ;;
            *) echo "invalid action '$IN_ACTION'"; exit 1 ;;
          esac
          [ "$IN_INSTALL" = true ] || IN_INSTALL=false
          case "${IN_SCOPE:-full}" in full|deep) ;; *) echo "invalid scope"; exit 1 ;; esac
          [[ "${IN_STEPS:-}" =~ ^[a-z,-]*$ ]] || { echo "invalid steps"; exit 1; }
          [[ "${IN_BACKUP_RUN:-}" =~ ^[0-9]*$ ]] || { echo "invalid backup_run"; exit 1; }
          {
            echo "ACTION=$IN_ACTION"
            echo "DIR=${IN_DIR:-elysium-wallet-tracker}"
            echo "INSTALL_DOCKER=$IN_INSTALL"
            echo "AUDIT_SCOPE=${IN_SCOPE:-full}"
            echo "MAINT_STEPS=${IN_STEPS:-}"
            echo "BACKUP_RUN=${IN_BACKUP_RUN:-}"
          } >> "$GITHUB_ENV"

      - name: Check inputs and secrets
        env:
          HAS_PW: ${{ secrets.VPS_PASSWORD != '' }}
          HAS_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
          HAS_TG: ${{ secrets.TG_BOT_TOKEN != '' }}
        run: |
          [[ "$DIR" =~ ^[A-Za-z0-9._/~-]+$ ]] || { echo "deploy_dir has unsafe characters"; exit 1; }
          [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] || { echo "missing VPS_HOST / VPS_USER secrets"; exit 1; }
          [ "$HAS_PW" = true ] || [ "$HAS_KEY" = true ] || { echo "set VPS_SSH_KEY or VPS_PASSWORD"; exit 1; }
          if [ "$ACTION" = deploy ] && [ "$HAS_TG" != true ]; then echo "deploy needs the TG_BOT_TOKEN secret"; exit 1; fi
          echo "action=$ACTION dir=$DIR auth=$([ "$HAS_KEY" = true ] && echo key || echo password)"

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          PORT="${VPS_PORT:-22}"
          if [ -n "$VPS_HOST_KEY" ]; then
            echo "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          else
            # Trust on first use; pin it later by saving this line as the VPS_HOST_KEY secret.
            ssh-keyscan -p "$PORT" -T 15 "$VPS_HOST" 2>/dev/null > ~/.ssh/known_hosts
            [ -s ~/.ssh/known_hosts ] || { echo "could not reach $VPS_HOST:$PORT over SSH"; exit 1; }
            echo "Host key fingerprints (set VPS_HOST_KEY to pin):"
            ssh-keygen -lf ~/.ssh/known_hosts
          fi
          if [ -n "$VPS_SSH_KEY" ]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
            echo "SSH_OPTS=-i $HOME/.ssh/id_deploy -o BatchMode=yes" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y -qq sshpass >/dev/null
            echo "SSH_OPTS=-o PreferredAuthentications=password -o PubkeyAuthentication=no" >> "$GITHUB_ENV"
            echo "USE_SSHPASS=1" >> "$GITHUB_ENV"
          fi
          echo "SSH_TARGET=$VPS_USER@$VPS_HOST" >> "$GITHUB_ENV"
          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"

      - name: Run on VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_ADMIN_IDS: ${{ secrets.TG_ADMIN_IDS }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ssh_() {
            if [ -n "${USE_SSHPASS:-}" ]; then
              sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
                -o ServerAliveInterval=30 $SSH_OPTS "$SSH_TARGET" "$@"
            else
              ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
                -o ServerAliveInterval=30 $SSH_OPTS "$SSH_TARGET" "$@"
            fi
          }
          ssh_ "echo connected to \$(hostname) as \$(id -un); uname -sr"
          if [ "$ACTION" = deploy ] && [ -z "$TG_CHAT_ID" ]; then
            # No TG_CHAT_ID secret: take the chat of the most recent message sent to the bot
            # (the user sends /start first). getUpdates only works while no webhook is set.
            TG_CHAT_ID=$(curl -fsS --retry 3 "https://api.telegram.org/bot${TG_BOT_TOKEN}/getUpdates" \
              | jq -r '[.result[] | (.message // .edited_message // .my_chat_member // .channel_post) | .chat.id | select(. != null)] | last // empty' || true)
            if [ -n "$TG_CHAT_ID" ]; then
              echo "::add-mask::$TG_CHAT_ID"
              echo "TG_CHAT_ID detected from the latest message sent to the bot"
            else
              # Normal once the Telegram UI runs (it consumes updates): the VPS keeps the
              # value it already has in .env; remote.sh fails if there is none.
              echo "TG_CHAT_ID not detectable here; keeping the value already on the VPS"
            fi
          fi
          if [ "$ACTION" = web ]; then
            # Schema change on the production database: only after a verified off-site backup.
            [ -n "$BACKUP_RUN" ] || { echo "web needs backup_run=<run id of a successful backup>"; exit 1; }
            api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/$1"; }
            concl=$(api "actions/runs/$BACKUP_RUN" | jq -r .conclusion)
            created=$(api "actions/runs/$BACKUP_RUN" | jq -r .created_at)
            arts=$(api "actions/runs/$BACKUP_RUN/artifacts" | jq '[.artifacts[] | select(.name|startswith("offsite-backup-")) | select(.expired|not)] | length')
            age_h=$(( ( $(date +%s) - $(date -d "$created" +%s) ) / 3600 ))
            echo "backup run $BACKUP_RUN: conclusion=$concl, live encrypted artifacts=$arts, age=${age_h}h"
            [ "$concl" = success ] && [ "$arts" -ge 1 ] && [ "$age_h" -le 36 ] || { echo "no recent verified backup: refusing to change the schema"; exit 1; }
          fi
          if [ "$ACTION" = deploy ] || [ "$ACTION" = web ] || [ "$ACTION" = tracker ] || [ "$ACTION" = web-hotfix ]; then
            # code bundle (tracked files only; never .env, config/, backups/)
            git archive --format=tar HEAD | \
              ssh_ "mkdir -p '$DIR' && cd '$DIR' && rm -rf agora_tracker && tar -xf -"
          fi
          if [ "$ACTION" = loadtest ] || [ "$ACTION" = maint ]; then
            # scripts and unit files only (maint steps and the load test read them from $DIR)
            git archive --format=tar HEAD scripts deploy | \
              ssh_ "mkdir -p '$DIR' && cd '$DIR' && tar -xf -"
          fi
          if [ "$ACTION" = deploy ]; then
            # Telegram secrets, written with 0600; POSTGRES_PASSWORD is generated on the VPS
            printf 'TG_BOT_TOKEN=%s\nTG_CHAT_ID=%s\nTG_ADMIN_IDS=%s\n' "$TG_BOT_TOKEN" "$TG_CHAT_ID" "$TG_ADMIN_IDS" | \
              ssh_ "umask 077 && cat > '$DIR/.env.incoming'"
          fi
          if [ "$ACTION" = maint ]; then
            [ -n "$MAINT_STEPS" ] || { echo "maint needs steps=..."; exit 1; }
            if [[ ",$MAINT_STEPS," == *",delete-copies,"* ]]; then
              # Interlock: deletions only after a successful off-site backup run whose
              # encrypted artifact still exists.
              [ -n "$BACKUP_RUN" ] || { echo "delete-copies needs backup_run=<run id of a successful backup>"; exit 1; }
              api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/$1"; }
              concl=$(api "actions/runs/$BACKUP_RUN" | jq -r .conclusion)
              arts=$(api "actions/runs/$BACKUP_RUN/artifacts" | jq '[.artifacts[] | select(.name|startswith("offsite-backup-")) | select(.expired|not)] | length')
              echo "backup run $BACKUP_RUN: conclusion=$concl, live encrypted artifacts=$arts"
              [ "$concl" = success ] && [ "$arts" -ge 1 ] || { echo "no verified backup: refusing to delete"; exit 1; }
            fi
            ssh_ "bash -s -- '$MAINT_STEPS' '$DIR'" < scripts/vps-maint.sh
            exit 0
          fi
          if [ "$ACTION" = backup ]; then
            # Off-site backup: streamed to this runner, restore-tested, encrypted with the
            # BACKUP_PASSPHRASE secret; nothing is written to the VPS disk.
            export USE_SSHPASS SSHPASS BACKUP_PASSPHRASE
            bash scripts/offsite-backup.sh
            exit 0
          fi
          if [ "$ACTION" = audit ]; then
            # Read-only infrastructure audit. This repository is public, so the output is
            # encrypted here (CMS, AES-256, to deploy/ops-recipient.pem) before anything is
            # printed; only the holder of the matching private key can read it.
            umask 077
            out="$RUNNER_TEMP/audit.txt"
            ssh_ "bash -s -- '$AUDIT_SCOPE'" < scripts/vps-audit.sh > "$out" 2>&1 || echo "(audit exited $?)" >> "$out"
            echo "audit captured: $(wc -c < "$out") bytes (plaintext not shown)"
            openssl cms -encrypt -aes256 -binary -in "$out" -outform PEM deploy/ops-recipient.pem > "$RUNNER_TEMP/audit.pem"
            shred -u "$out"
            echo "-----ENCRYPTED AUDIT BEGIN-----"; cat "$RUNNER_TEMP/audit.pem"; echo "-----ENCRYPTED AUDIT END-----"
            exit 0
          fi
          ssh_ "bash -s -- '$ACTION' '$DIR' '$INSTALL_DOCKER'" < scripts/remote.sh

      - name: Store encrypted backup (90 days)
        if: env.ACTION == 'backup' && success()
        uses: actions/upload-artifact@v4
        with:
          name: offsite-backup-${{ env.BACKUP_STAMP }}
          path: ${{ runner.temp }}/offsite/upload/
          retention-days: ${{ github.event_name == 'schedule' && 14 || 90 }}
          compression-level: 0
          if-no-files-found: error
