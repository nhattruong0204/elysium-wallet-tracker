name: wiki
# Publishes docs/wiki/ to the repository wiki. The wiki's git repository only exists after its
# first page was created in the GitHub UI (Wiki tab -> "Create the first page"); until then
# this job fails with a message saying so.
on:
  push:
    branches: [main, ops]
    paths: ["docs/wiki/**", ".github/workflows/wiki.yml", "deploy/WIKI_REQUEST"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wiki
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sync docs/wiki to the wiki
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.wiki.git"
          if ! git clone --quiet --depth 1 "$url" wiki-out 2>/dev/null; then
            echo "::error::The wiki has no pages yet. Open the repository's Wiki tab, create the first page (any text), then re-run this workflow."
            exit 1
          fi
          cp docs/wiki/*.md wiki-out/
          cd wiki-out
          git add -A
          if git diff --cached --quiet; then echo "wiki already up to date"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Sync from docs/wiki at ${SHA::7}"
          git push --quiet
          echo "published $(ls *.md | wc -l) page(s)"
