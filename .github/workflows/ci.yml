name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff mypy types-requests types-PyYAML pip-audit
      - run: ruff check .
      - run: mypy agora_tracker
      - name: Migration graph preflight (single linear head)
        run: python -m agora_tracker.preflight --graph-only
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # the suite takes ~1 min; never sit on a hung test for hours
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracker -d tracker_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://tracker:tracker@localhost:5432/tracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: PostgreSQL 16 client (for the backup/restore test)
        continue-on-error: true   # network hiccup -> only that test is skipped (-rs shows it)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --retry 5 --retry-all-errors \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt pytest playwright
      - name: Avoid JIT compilation overhead in the disposable test database
        run: |
          python - <<'PYTHON'
          import os
          import psycopg
          url = os.environ["TEST_DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://")
          with psycopg.connect(url, autocommit=True) as conn:
              conn.execute("ALTER DATABASE tracker_test SET jit = off")
          PYTHON
      - name: Chromium and WebKit for Activity and Mini App browser tests
        run: python -m playwright install --with-deps chromium webkit
      - run: python -m pytest -v -rs

  ingress-proxy:
    # F-17 rehearsal in a DISPOSABLE runner: the nginx template from deploy/nginx in front of the
    # REAL IngressGuard/IngressServer, verified by scripts/verify_ingress_proxy.py. Nothing here
    # touches the production proxy.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nginx
      - name: Render the template with a throwaway CA and secret
        run: |
          set -euo pipefail
          H=app.example.test
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=$H" \
            -addext "subjectAltName=DNS:$H" -keyout /tmp/key.pem -out /tmp/cert.pem 2>/dev/null
          sudo install -d -m 0750 /etc/elysium
          SECRET=$(openssl rand -hex 32)
          echo "TRADING_INGRESS_SECRET=$SECRET" >> "$GITHUB_ENV"
          echo "::add-mask::$SECRET"
          printf 'proxy_set_header X-Elysium-Ingress "%s";\n' "$SECRET" | sudo tee /etc/elysium/ingress-secret.conf >/dev/null
          sudo chown root:www-data /etc/elysium/ingress-secret.conf && sudo chmod 0640 /etc/elysium/ingress-secret.conf
          sed -e "s#__ORIGIN_HOST__#$H#g" -e "s#__INGRESS_PORT__#8765#g" deploy/nginx/ingress-proxy.conf.template \
            | sudo tee /etc/elysium/ingress-proxy.conf >/dev/null
          sed -e "s#__ORIGIN_HOST__#$H#g" -e "s#__INGRESS_PORT__#8765#g" -e "s#__CERT__#/tmp/cert.pem#" \
              -e "s#__KEY__#/tmp/key.pem#" deploy/nginx/elysium-trading.conf.template \
            | sudo tee /etc/nginx/conf.d/elysium-trading.conf >/dev/null
          sudo rm -f /etc/nginx/sites-enabled/default
          echo "127.0.0.1 $H" | sudo tee -a /etc/hosts
          sudo nginx -t
          sudo systemctl restart nginx
      - name: Start the real guard behind it
        run: |
          nohup python scripts/ci_ingress_upstream.py --origin https://app.example.test > /tmp/upstream.log 2>&1 &
          for i in $(seq 1 100); do ss -ltn | grep -q '127.0.0.1:8765' && exit 0; sleep 0.2; done
          echo "upstream did not start"; cat /tmp/upstream.log; exit 1
      - name: Verify the proxy (remote + local checks)
        run: |
          sudo -E env "PATH=$PATH" REQUESTS_CA_BUNDLE=/tmp/cert.pem \
            python scripts/verify_ingress_proxy.py --origin https://app.example.test --burst 60 \
            --local --ingress-port 8765 --secret-include /etc/elysium/ingress-secret.conf
      - if: always()
        run: cat /tmp/upstream.log; sudo tail -50 /var/log/nginx/error.log || true

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare config
        run: |
          mkdir -p config backups
          cp config.example.yaml config/config.yaml
          cp watchlist.example.txt config/watchlist.txt
          printf 'POSTGRES_PASSWORD=%s\nTG_BOT_TOKEN=\nTG_CHAT_ID=\n' "$(openssl rand -hex 16)" > .env
          sudo chown 999:999 backups   # postgres image user
      - run: docker compose config -q
      - run: docker compose build
      - name: Compose end-to-end
        run: |
          docker compose up -d postgres
          docker compose run --rm migrate
          docker compose run --rm tracker --status
          # Telegram UI: migrated but not running -> UI health must fail as well
          if docker compose run --rm tracker --health-ui; then
            echo "ui healthcheck should fail without a heartbeat"; exit 1
          fi
          # one live market-snapshot round against Agora (non-fatal: third-party API)
          docker compose run --rm tracker --collect-once || echo "collector round failed (Agora unreachable?)"
          # migrated but no heartbeat yet: health must report unhealthy (exit 1)
          if docker compose run --rm tracker --health; then
            echo "healthcheck should fail without a heartbeat"; exit 1
          fi
          # backup service writes a verified dump
          docker compose up -d backup
          for i in $(seq 1 30); do ls backups/tracker-*.dump >/dev/null 2>&1 && break; sleep 2; done
          ls -l backups/
          dump=$(ls backups/tracker-*.dump | head -1)
          # restore it into the running stack
          docker compose up -d tracker || true
          ./scripts/restore.sh "$dump"
          docker compose run --rm tracker --status
      - if: always()
        run: docker compose logs --no-color | tail -100
      - if: always()
        run: docker compose down -v
